spring:
  application:
    name: mock-pg
  datasource:
    # 이 기관의 데이터베이스입니다. pay-api와 다른 데이터베이스여야 합니다.
    url: ${MOCK_PG_DB_URL:jdbc:postgresql://localhost:5432/paritypay_pg}
    username: ${MOCK_PG_DB_USERNAME:paritypay}
    password: ${MOCK_PG_DB_PASSWORD:paritypay}
    hikari:
      pool-name: mock-pg-pool
      maximum-pool-size: 10

  flyway:
    # 자기 스키마는 자기가 만듭니다. 위치가 pay-api와 다른 이유는 mock-bank.yml에 적어 두었습니다.
    enabled: true
    locations: classpath:db/mock-pg
  jpa:
    # 테스트에서는 두 앱이 클래스패스를 공유합니다. 기관은 JPA를 쓰지 않습니다.
    open-in-view: false

# 결과를 알릴 곳입니다. 비어 있으면 웹훅을 보내지 않습니다 — 실제 PG도 등록된 주소가 없으면
# 보내지 않고, 그때는 상대가 조회로 확정해야 합니다.
mock-pg:
  webhook:
    url: ${MOCK_PG_WEBHOOK_URL:}
    secret: ${MOCK_PG_WEBHOOK_SECRET:local-development-only-webhook-secret}

server:
  port: ${MOCK_PG_PORT:8091}
  error:
    include-message: never

logging:
  level:
    io.parity.mockpg: INFO
