spring:
  application:
    name: parity-pay
  datasource:
    url: ${PARITYPAY_DB_URL:jdbc:postgresql://localhost:5432/paritypay}
    username: ${PARITYPAY_DB_USERNAME:paritypay}
    password: ${PARITYPAY_DB_PASSWORD:paritypay}
    hikari:
      pool-name: paritypay-pool
      maximum-pool-size: 20
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway만 변경합니다. 애플리케이션이 테이블을 만들지 않습니다.
      # 근거: docs/05-technical-design.md §13
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true
  task:
    scheduling:
      # 기본값은 1입니다. 스케줄 작업이 여섯 개(발행기, 복구 4종, 대사)인데 한 스레드를 나눠 쓰면
      # 느린 작업 하나가 나머지를 멈춰 세웁니다. 발행기는 0.5초마다 돌아야 하고, 불변조건 지표
      # 계산은 원장 200만 건에서 4.5초가 걸립니다(M-006). 둘이 같은 스레드에 있으면 안 됩니다.
      pool:
        size: 4
  kafka:
    bootstrap-servers: ${PARITYPAY_KAFKA_SERVERS:localhost:9092}
    producer:
      # 유실 없이 전달되었는지 확인한 뒤에만 PUBLISHED로 표시합니다.
      acks: all
      properties:
        enable.idempotence: true
        # 멱등 프로듀서는 in-flight 5건까지 파티션 내 순서를 보장합니다. 파티션 키가 Aggregate ID이므로
        # 배치로 보내도 한 Aggregate의 이벤트 순서는 유지됩니다.
        max.in.flight.requests.per.connection: 5
        # 발행기가 배치를 통째로 넘기므로 레코드를 모아 보낼 수 있습니다. 확인은 여전히 기다립니다.
        linger.ms: 5
        # 브로커가 없을 때 send()가 붙잡혀 있는 시간입니다. 기본값 60초는 발행 스레드를 1분씩
        # 멈춰 세웁니다. 이벤트는 Outbox에 남아 있으므로 빨리 포기하고 다음 폴링에 다시 시도합니다.
        max.block.ms: 5000
      batch-size: 65536
      compression-type: lz4
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: paritypay-wallet-projection
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

paritypay:
  # 외부 기관(Mock Bank)은 별도 프로세스입니다. 근거: docs/05-technical-design.md §10
  mock-bank:
    base-url: ${PARITYPAY_MOCK_BANK_URL:http://localhost:8090}
    connect-timeout: 2s
    # 읽기 타임아웃이 곧 "결과를 모르는 상태"로 가는 시간입니다. 길게 잡으면 그동안 스레드와
    # 커넥션이 묶이고, 짧게 잡으면 정상 응답도 미확정이 됩니다. 복구가 있으므로 짧게 둡니다.
    read-timeout: 3s
  # 외부 카드 PG도 별도 프로세스입니다. 은행과 값을 따로 둡니다.
  mock-pg:
    base-url: ${PARITYPAY_MOCK_PG_URL:http://localhost:8091}
    connect-timeout: 2s
    read-timeout: 3s
  events:
    topic: paritypay.events
    consumer-group: paritypay-wallet-projection
    publisher-enabled: true
    poll-interval-ms: 500
    batch-size: 100
    # 한 번 깨어났을 때 이어서 비울 배치 수입니다. 100 × 20 = 폴링 한 번에 최대 2,000건입니다.
    max-rounds-per-poll: 20
    max-attempts: 10
    # 계약 검사는 테스트·로컬에서만 켭니다. 이유는 OutboxProperties javadoc에 있습니다.
    validate-schema: false
    base-backoff: 1s
    max-backoff: 5m
  webhook:
    # 기관과 나눠 가진 비밀입니다. 운영에서는 반드시 환경변수로 주입합니다.
    secret: ${PARITYPAY_WEBHOOK_SECRET:local-development-only-webhook-secret}
    # 서명된 시각의 허용 오차입니다. 좁을수록 재전송 창이 작아지지만, 기관과 우리 시계 차이보다
    # 좁으면 정상 웹훅이 거절됩니다. 중복 자체는 webhook_receipt가 막습니다.
    tolerance: 5m
  observability:
    # 불변조건 지표를 다시 계산하는 주기입니다. 게이지는 캐시된 값을 읽으므로 스크레이프 횟수와
    # 무관하게 이 주기만큼만 DB를 씁니다. 근거: reports/11 M-006
    invariant-refresh-ms: 30000
    invariant-initial-delay-ms: 5000
  wallet:
    # ADR-004의 기본안입니다. 비교 측정 결과는 reports/11에 기록합니다.
    balance-strategy: CONDITIONAL_UPDATE
  reconciliation:
    enabled: true
    # 매일 새벽 4시에 대사를 돌립니다.
    cron: "0 0 4 * * *"
    # 외부 기록이 늦게 도착하는 것을 정상으로 보는 시간입니다.
    delay-tolerance: 30m
    window: 7d
  settlement:
    # 플랫폼 수수료율입니다. basis point(만분율) 정수로 관리해 비율 계산에서 부동소수점을 없앱니다.
    fee-basis-points: 1000
    consumer-group: paritypay-settlement
    recovery-enabled: true
    recovery-interval-ms: 5000
    recovery-lease: 30s
    recovery-base-backoff: 2s
    recovery-max-backoff: 10m
    recovery-max-attempts: 8
    recovery-not-found-confirm-threshold: 3
  recovery:
    # 외부 PG 환불의 미확정 복구입니다. 환불도 재요청하지 않고 조회로만 확정합니다.
    cancellation:
      enabled: true
      interval-ms: 5000
      grace: 30s
      lease: 30s
      base-backoff: 2s
      max-backoff: 10m
      max-attempts: 8
      not-found-confirm-threshold: 3
      batch-size: 50
    # 외부 PG 결제의 미확정 복구입니다. 충전과 같은 규칙이며 대상만 다릅니다.
    payment:
      enabled: true
      interval-ms: 5000
      grace: 30s
      lease: 30s
      base-backoff: 2s
      max-backoff: 10m
      max-attempts: 8
      not-found-confirm-threshold: 3
      batch-size: 50
    top-up:
      enabled: true
      interval-ms: 5000
      # 정상 처리 중인 요청을 복구 작업이 가로채지 않도록 두는 여유 시간입니다.
      grace: 30s
      lease: 30s
      base-backoff: 2s
      max-backoff: 10m
      max-attempts: 8
      # 외부에 기록이 "없음"으로 연속 확인되어야 하는 횟수입니다.
      not-found-confirm-threshold: 3
      batch-size: 50

server:
  port: ${PARITYPAY_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    # 그룹과 태그 순서를 고정합니다. 순서가 흔들리면 스냅샷 비교가 의미 없는 차이를 냅니다.
    tags-sorter: alpha
    operations-sorter: alpha
  writer-with-order-by-keys: true
  writer-with-default-pretty-printer: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
  # 모든 지표·관측에 애플리케이션 이름을 붙입니다.
  observations:
    key-values:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        # 명시적으로 켭니다. 지표 수집은 이 시스템의 운영 요구사항이지 선택 기능이 아닙니다.
        enabled: true
  tracing:
    sampling:
      # 로컬·실험 환경에서는 전량 샘플링합니다. 운영에서는 비용을 보고 낮춥니다.
      probability: ${PARITYPAY_TRACE_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${PARITYPAY_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  pattern:
    # traceId를 모든 로그에 남깁니다. 근거: docs/05-technical-design.md §12
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]"

---
spring:
  config:
    activate:
      on-profile: local
  jpa:
    properties:
      hibernate:
        format_sql: true

paritypay:
  # 외부 기관(Mock Bank)은 별도 프로세스입니다. 근거: docs/05-technical-design.md §10
  mock-bank:
    base-url: ${PARITYPAY_MOCK_BANK_URL:http://localhost:8090}
    connect-timeout: 2s
    # 읽기 타임아웃이 곧 "결과를 모르는 상태"로 가는 시간입니다. 길게 잡으면 그동안 스레드와
    # 커넥션이 묶이고, 짧게 잡으면 정상 응답도 미확정이 됩니다. 복구가 있으므로 짧게 둡니다.
    read-timeout: 3s
  events:
    validate-schema: true
  security:
    # 로컬 전용 값입니다. 운영에서는 반드시 PARITYPAY_JWT_SECRET으로 주입합니다.
    jwt-secret: local-development-only-secret-key-do-not-use-in-production
    bootstrap-operators:
      - email: ops-viewer@paritypay.local
        password: local-ops-password
        roles: [OPS_VIEWER]
      - email: ops-operator@paritypay.local
        password: local-ops-password
        roles: [OPS_VIEWER, OPS_OPERATOR]
      - email: ops-approver@paritypay.local
        password: local-ops-password
        roles: [OPS_VIEWER, OPS_APPROVER]

logging:
  level:
    io.parity.pay: DEBUG
