# 벤치마크는 PR 게이트가 아닙니다. 시간이 오래 걸리고 결과가 실행 환경에 민감해서,
# 값 자체보다 "회귀가 있었는가"를 보기 위해 주기적으로 돌립니다.
# 근거: ADR-004, docs/10-test-strategy.md §7
name: Benchmark

on:
  schedule:
    # 매주 월요일 새벽에 돌립니다.
    - cron: '0 18 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  balance-strategy:
    name: 잔액 차감 전략 비교 (ADR-004)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run benchmark
        run: >-
          ./gradlew :apps:pay-api:test --no-daemon -PincludeBenchmarks
          --tests "*BalanceStrategyBenchmarkTest"

      # 원본 결과를 남깁니다. 수치를 보고서에 옮길 때 근거가 됩니다.
      - name: Upload benchmark result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-result
          path: |
            apps/pay-api/build/reports/adr-004-balance-strategy.txt
            apps/pay-api/build/reports/tests/test/
          retention-days: 90
