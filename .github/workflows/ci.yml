# PR과 main 푸시에서 도는 품질 게이트입니다.
# 근거: docs/10-test-strategy.md §11
name: CI

on:
  pull_request:
  push:
    branches: [main]

# 같은 브랜치에서 새 푸시가 오면 진행 중인 실행을 취소합니다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: 빌드와 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # 포맷은 컨테이너를 띄우기 전에 봅니다. 가장 흔하고 가장 빨리 판정되는 실패입니다.
      # 린터(Error Prone)는 컴파일 중에 돌므로 아래 build 단계에 포함됩니다.
      - name: Check formatting
        run: ./gradlew spotlessCheck --no-daemon

      # 통합 테스트는 Testcontainers로 PostgreSQL과 Redpanda를 직접 띄웁니다.
      # 인메모리 대체가 없으므로 러너에 Docker가 필요합니다(ubuntu-latest에 기본 포함).
      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7

  checks:
    name: 문서와 추적성
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # 설계 문서가 서로를 참조하므로 깨진 링크는 조용히 남습니다.
      - name: Check documentation links
        run: python3 scripts/check-docs-links.py

      # 불변조건이 하나라도 테스트에서 언급되지 않으면 실패합니다.
      - name: Check invariant traceability
        run: python3 scripts/check-invariant-coverage.py

  frontend:
    name: 프론트엔드
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Install
        run: pnpm install --frozen-lockfile

      # 생성물이 커밋된 스냅샷과 어긋나면 실패합니다. 백엔드가 API를 바꾸고 타입을 다시 만들지
      # 않으면 여기서 드러납니다. 근거: docs/14-frontend-design.md §8
      - name: Check generated API types are current
        run: |
          pnpm generate
          git diff --exit-code packages/api-client/src/generated

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  secrets:
    name: 비밀값 검사
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks가 이력 전체를 훑을 수 있게 합니다.
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
