# 로컬 실행과 장애 실험용 의존성입니다.
# 근거: docs/05-technical-design.md §2, docs/13-implementation-checklist.md Phase 0
services:
  postgres:
    image: postgres:17-alpine
    container_name: paritypay-postgres
    environment:
      POSTGRES_DB: paritypay
      POSTGRES_USER: paritypay
      POSTGRES_PASSWORD: paritypay
      TZ: UTC
    ports:
      # 다른 프로젝트가 5432를 쓰고 있으면 PARITYPAY_DB_PORT로 바꿉니다.
      - "${PARITYPAY_DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paritypay -d paritypay"]
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda:
    image: redpandadata/redpanda:v24.3.6
    container_name: paritypay-redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      # 로컬 개발용 상한입니다. 지정하지 않으면 Redpanda가 호스트 메모리를 기준으로 잡으려 하고,
      # Docker Desktop에 다른 컨테이너가 많으면 OOM으로 죽습니다(F-001 실험 중에 겪었습니다).
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "${PARITYPAY_KAFKA_PORT:-9092}:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: paritypay-redis
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "${PARITYPAY_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 외부 금융기관 대역입니다. 별도 프로세스여야 죽이고·늦추고·끊는 실험을 할 수 있습니다.
  # 근거: docs/05-technical-design.md §10
  mock-bank:
    image: eclipse-temurin:21-jre
    container_name: paritypay-mock-bank
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MOCK_BANK_DB_URL: jdbc:postgresql://postgres:5432/paritypay
      MOCK_BANK_DB_USERNAME: paritypay
      MOCK_BANK_DB_PASSWORD: paritypay
      MOCK_BANK_PORT: 8090
    ports:
      - "${PARITYPAY_MOCK_BANK_PORT:-8090}:8090"
    volumes:
      # 먼저 빌드해야 합니다: ./gradlew :apps:mock-bank:bootJar
      - ./apps/mock-bank/build/libs:/app:ro
    command: ["java", "-jar", "/app/mock-bank-0.1.0-SNAPSHOT.jar"]

  # 관측성 스택입니다. 근거: docs/05-technical-design.md §12, Phase 6
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: paritypay-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/rules:/etc/prometheus/rules:ro
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.5.1
    container_name: paritypay-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  # OTLP를 직접 받는 올인원 트레이스 백엔드입니다. 별도 컬렉터를 두지 않습니다.
  jaeger:
    image: jaegertracing/all-in-one:1.65.0
    container_name: paritypay-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

volumes:
  postgres-data:
