# 앱 하나를 서빙하고 /api를 pay-api로 넘깁니다. 근거: ADR-011
#
# 브라우저가 보는 것은 **자기 오리진의 /api**뿐입니다. 그래서 교차 오리진 요청이 없고,
# 서버에 CORS 설정도 없습니다. 개발에서 Vite가 하던 일을 여기서 합니다.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 프록시 뒤에서도 실제 클라이언트를 알아볼 수 있게 넘겨 줍니다.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        # **뒤에 슬래시를 붙이지 않습니다.** 붙이면 nginx가 /api 접두사를 떼고 넘기는데,
        # 그러면 리프레시 쿠키의 Path=/api/v1/auth가 브라우저가 보는 경로와 어긋나 다음
        # 요청에 실리지 않습니다. 오류 없이 조용히 일어나고, 증상은 "로그인은 되는데 15분 뒤
        # 로그아웃"입니다. 근거: ADR-010, ADR-011
        proxy_pass http://pay-api:8080;

        # 충전·결제는 외부 기관을 기다립니다. 기본 60초는 우리 read-timeout(3초)보다 훨씬
        # 길어 문제가 없지만, 명시해 두어야 나중에 줄일 때 근거가 남습니다.
        proxy_read_timeout 70s;
    }

    # SPA 폴백입니다. /orders/123 같은 경로로 새로고침해도 index.html이 나가야 합니다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 해시가 붙은 번들은 내용이 바뀌면 이름이 바뀝니다. index.html은 그렇지 않으므로
    # 캐시하면 배포해도 옛 번들을 계속 가리킵니다.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
