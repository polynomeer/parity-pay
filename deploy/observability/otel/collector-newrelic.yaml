# 앱 → 컬렉터 → New Relic (SaaS).
#
# Datadog 과 같은 모양입니다 — **컨테이너가 없고**, 바뀌는 것은 이 파일 하나입니다. 그것이
# ADR-017 이 노린 성질입니다: 자체 설치든 SaaS든 애플리케이션은 어디로 가는지 모릅니다.
#
# **아직 띄워서 확인하지 못했습니다.** 라이선스 키가 있어야 하고, 키는 사용자가 직접 넣습니다.
# reports/14 §9 에 "미검증"으로 적혀 있습니다.
#
# 전용 exporter 가 없습니다. contrib 0.119.0 의 exporter 목록에 newrelic 이 없고(직접 확인),
# New Relic 이 그것을 2022년에 폐기하고 OTLP 로 옮겼기 때문입니다. 그래서 표준 otlphttp 입니다.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # 공용 인터넷으로 나가므로 묶어 보냅니다. Datadog 설정과 같은 이유입니다.
  batch:
    timeout: 10s
    send_batch_size: 100
    send_batch_max_size: 1000

exporters:
  otlphttp/newrelic:
    # 리전입니다. US 가 기본이고 EU 는 https://otlp.eu01.nr-data.net 입니다.
    # New Relic 문서는 공용망에서 gRPC 보다 HTTP/protobuf 를 권합니다.
    endpoint: ${env:NEW_RELIC_OTLP_ENDPOINT}
    headers:
      # 라이선스 키입니다. **파일에도 .apm/env 에도 적지 않습니다** — 환경변수로만 지나갑니다.
      api-key: ${env:NEW_RELIC_LICENSE_KEY}
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/newrelic]
  telemetry:
    metrics:
      level: basic
