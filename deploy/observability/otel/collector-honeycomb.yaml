# 앱 → 컬렉터 → Honeycomb (SaaS).
#
# Datadog·New Relic 과 같은 모양입니다 — 컨테이너가 없고 이 파일 하나만 바뀝니다. 근거: ADR-017
#
# **아직 띄워서 확인하지 못했습니다.** API 키가 있어야 하고, 키는 사용자가 직접 넣습니다.
#
# contrib 0.119.0 에 honeycombmarker exporter 가 있지만 그것은 **로그를 마커로 바꾸는 것**이고
# 트레이스를 보내지 않습니다(stability: logs Alpha, traces Undefined — 직접 확인). Honeycomb 자신도
# 추가 플러그인 없이 표준 OTLP exporter 로 보내라고 합니다.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 10s
    send_batch_size: 100
    send_batch_max_size: 1000

exporters:
  otlphttp/honeycomb:
    # US 가 기본이고 EU 는 https://api.eu1.honeycomb.io 입니다.
    endpoint: ${env:HONEYCOMB_API_ENDPOINT}
    headers:
      x-honeycomb-team: ${env:HONEYCOMB_API_KEY}
      # 데이터셋 이름은 **Honeycomb Classic 계정에서만** 필요합니다. 지금 가입하면 Environments
      # 쪽이라 이 헤더를 보내면 안 됩니다 — 그래서 주석으로 둡니다.
      # x-honeycomb-dataset: pay-api
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/honeycomb]
  telemetry:
    metrics:
      level: basic
