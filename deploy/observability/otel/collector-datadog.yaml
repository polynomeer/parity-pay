# 앱 → 컬렉터 → Datadog (SaaS).
#
# 다른 백엔드와 달리 **컨테이너가 없습니다.** 받는 쪽이 남의 서비스이므로 바뀌는 것은 이 파일 하나이고,
# 그것이 ADR-017이 노린 성질입니다 — 자체 설치든 SaaS든 애플리케이션은 모릅니다.
#
# **아직 띄워서 확인하지 못했습니다.** 체험판 계정과 API 키가 있어야 하고, 키는 사용자가 직접 넣습니다.
# 이 파일은 키를 받은 날 한 줄로 끝내기 위한 배선이며, reports/14 §9에 "미검증"으로 적혀 있습니다.
#
# 보내는 경로가 둘입니다. 여기서는 오래된 쪽인 `datadog` exporter를 씁니다 — 우리 컬렉터가
# contrib **0.119.0**에 고정돼 있고, Datadog의 현재 설정 문서는 contrib v0.154.0 이상에서 시험했다고
# 밝히기 때문입니다. 그쪽이 지금 권하는 길은 Datadog의 OTLP 인테이크(`https://otlp.<site>`에
# `dd-api-key` 헤더)이고, 컬렉터를 올릴 때 같이 바꿀 수 있습니다.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Datadog 문서는 개발 환경이 아니면 batch 를 **필수**로 둡니다. 인테이크에 크기 상한이 있어
  # 너무 큰 묶음은 413으로 거절됩니다. 다른 설정 파일(1초)보다 느슨하게 두는 이유입니다.
  batch:
    timeout: 10s
    send_batch_size: 100
    send_batch_max_size: 1000

exporters:
  datadog:
    api:
      # 키는 환경변수로만 들어옵니다. **파일에도 .apm/env 에도 적지 않습니다.**
      key: ${env:DD_API_KEY}
      # 사이트는 계정을 만든 리전입니다. 틀리면 데이터가 다른 조직으로 가지 않고 그냥 거절됩니다.
      # 로그인 URL이 곧 사이트입니다 (datadoghq.com · datadoghq.eu · ap1.datadoghq.com …).
      site: ${env:DD_SITE}
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [datadog]
  telemetry:
    metrics:
      level: basic
