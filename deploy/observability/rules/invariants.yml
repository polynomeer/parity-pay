# 불변조건 위반은 임계치를 정할 필요가 없습니다. 한 건이라도 즉시 경보입니다.
# 근거: docs/05-technical-design.md §12
groups:
  - name: paritypay-invariants
    rules:
      - alert: LedgerUnbalanced
        expr: paritypay_invariant_unbalanced_ledger_transactions > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "INV-001 위반: 차변과 대변이 맞지 않는 원장 거래가 있습니다"

      - alert: NegativeWalletBalance
        expr: paritypay_invariant_negative_wallet_balances > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "INV-003 위반: 가용 잔액이 음수인 지갑이 있습니다"

      - alert: BalanceSnapshotDrift
        expr: paritypay_invariant_balance_snapshot_drift > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "INV-010 위반: 잔액 스냅샷과 원장 재생값이 다릅니다"

      - alert: OverCancelledPayment
        expr: paritypay_invariant_over_cancelled_payments > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "INV-005 위반: 누적 취소액이 승인액을 넘은 결제가 있습니다"

      # 아래는 임계치를 기준선 측정 후 조정해야 하는 운영 지표입니다.
      - alert: OutboxBacklogGrowing
        expr: paritypay_outbox_oldest_pending_age_seconds > 60
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Outbox 발행이 1분 이상 밀리고 있습니다"

      # 적체가 한 파티션 키에 몰린 상황입니다. 전체 적체 경보와 다른 사고를 봅니다 — 전체가 작아도
      # 한 지갑만 계속 밀리면 그 지갑의 이벤트는 영영 따라잡지 못합니다.
      # 임계치 100건은 실측에서 나왔습니다. 한 파티션 키의 발행은 직렬화되어 기본 설정에서 초당
      # 26.6건이 상한이므로(M-003), 100건은 정상이면 약 4초에 사라집니다. 5분을 넘긴다는 것은
      # 비워지는 속도보다 쌓이는 속도가 빠르거나 그 키가 막혀 있다는 뜻입니다.
      # 어느 키인지는 GET /api/v1/admin/outbox-events/backlog 로 봅니다.
      - alert: OutboxBacklogConcentratedOnOneKey
        expr: paritypay_outbox_max_partition_pending > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "한 파티션 키에 미발행 이벤트가 5분 넘게 100건 이상 쌓여 있습니다"

      # 소비자 적체입니다. Outbox 적체와 다른 사고입니다 — 발행이 멈추면 이벤트가 브로커에 없고,
      # 소비가 멈추면 브로커에는 있는데 프로젝션과 정산이 따라오지 못합니다.
      # 임계치 1,000건은 기준선이 아니라 출발점입니다. 발행 실측이 1대 기준 2,700건/초였으므로
      # 1,000건은 정상 소비 속도에서 1초 이내에 사라져야 하는 양입니다. 운영 데이터로 조정합니다.
      - alert: ConsumerLagGrowing
        expr: kafka_consumer_fetch_manager_records_lag_max > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "소비자가 5분 넘게 1,000건 이상 밀려 있습니다 ({{ $labels.client_id }})"

      # 재분배가 반복되면 소비자 그룹이 자리를 잡지 못하고 소비가 계속 끊깁니다. 중복 전달은
      # 소비자가 흡수하지만(M-002), 진행이 되지 않는 것은 별개 문제입니다.
      - alert: ConsumerRebalancing
        expr: increase(kafka_consumer_coordinator_failed_rebalance_total[10m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "소비자 재분배가 실패하고 있습니다 ({{ $labels.client_id }})"

      - alert: UnknownTopUpsStuck
        expr: paritypay_recovery_manual_review > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "자동 복구를 포기하고 사람 확인이 필요한 거래가 있습니다"
