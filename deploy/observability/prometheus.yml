# ParityPay 지표 수집 설정. 근거: docs/05-technical-design.md §12
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/invariants.yml

scrape_configs:
  - job_name: parity-pay
    metrics_path: /actuator/prometheus
    static_configs:
      # 컨테이너에서 호스트의 애플리케이션을 봅니다.
      - targets: ["host.docker.internal:8080"]
