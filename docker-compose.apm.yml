# APM 비교 실험용 백엔드입니다. 애플리케이션은 이 파일의 어떤 서비스도 알지 못합니다 —
# 언제나 OTLP 한 자리로만 보내고, 어디로 가는지는 컬렉터가 정합니다. 근거: ADR-017
#
# 직접 쓰지 말고 scripts/apm.sh 로 띄웁니다. 프로필마다 필요한 컨테이너가 다르고, 자체 에이전트를
# 쓰는 도구는 앱 쪽 환경변수까지 바꿔야 하기 때문입니다.
services:
  # ---------- OTLP를 받는 도구 공용 ----------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.119.0
    container_name: paritypay-otel-collector
    profiles: ["apm-jaeger", "apm-tempo", "apm-zipkin", "apm-signoz", "apm-openobserve",
      "apm-uptrace", "apm-elastic", "apm-datadog", "apm-newrelic", "apm-honeycomb",
      "apm-dynatrace", "apm-splunk"]
    # 설정 파일만 바꿔 끼웁니다. 이것이 "APM을 바꾸는 한 곳"입니다.
    command: ["--config=/etc/otel/collector-${PARITYPAY_APM:-jaeger}.yaml"]
    # 설정 파일이 참조하는 값만 넘깁니다. 컬렉터는 백엔드 주소를 환경변수로 받고, 어떤 도구인지는
    # 모릅니다 — 그 선택은 어느 설정 파일을 읽느냐 하나로 끝납니다.
    environment:
      PARITYPAY_SIGNOZ_OTLP_GRPC_PORT: "${PARITYPAY_SIGNOZ_OTLP_GRPC_PORT:-4327}"
      # Datadog 프로필에서만 쓰입니다. **키에 기본값을 두지 않습니다**(ADR-011) — 비어 있으면
      # 컬렉터가 뜨지 않고, 애초에 scripts/apm.sh 가 키 없이는 진행하지 않습니다. 키는 어느 파일에도
      # 적히지 않고 이 환경변수로만 지나갑니다.
      DD_API_KEY: "${DD_API_KEY:-}"
      # 사이트는 비밀값이 아니라 리전 선택입니다. 기본은 US1.
      DD_SITE: "${DD_SITE:-datadoghq.com}"
      # 아래는 각 프로필에서만 쓰입니다. **키에 기본값을 두지 않습니다**(ADR-011) — 비어 있으면
      # 컬렉터가 뜨지 않고, 애초에 scripts/apm.sh 가 키 없이는 진행하지 않습니다. 어느 파일에도
      # 적히지 않고 이 환경변수로만 지나갑니다.
      #
      # 자체 호스팅 쪽: 비밀값을 scripts/apm.sh 가 만들어 .apm/ 아래 두고 여기로 넘깁니다.
      PARITYPAY_OPENOBSERVE_AUTH: "${PARITYPAY_OPENOBSERVE_AUTH:-}"
      PARITYPAY_UPTRACE_PROJECT_TOKEN: "${PARITYPAY_UPTRACE_PROJECT_TOKEN:-}"
      PARITYPAY_ELASTIC_APM_TOKEN: "${PARITYPAY_ELASTIC_APM_TOKEN:-}"
      # SaaS 쪽: 사용자가 직접 넣습니다. 리전·주소는 비밀값이 아니라 기본값이 있습니다.
      NEW_RELIC_LICENSE_KEY: "${NEW_RELIC_LICENSE_KEY:-}"
      NEW_RELIC_OTLP_ENDPOINT: "${NEW_RELIC_OTLP_ENDPOINT:-https://otlp.nr-data.net}"
      HONEYCOMB_API_KEY: "${HONEYCOMB_API_KEY:-}"
      HONEYCOMB_API_ENDPOINT: "${HONEYCOMB_API_ENDPOINT:-https://api.honeycomb.io}"
      # Dynatrace 는 주소에 테넌트 ID 가 들어가 기본값을 둘 수 없습니다.
      DT_ENDPOINT: "${DT_ENDPOINT:-}"
      DT_AUTHORIZATION: "${DT_AUTHORIZATION:-}"
      SPLUNK_ACCESS_TOKEN: "${SPLUNK_ACCESS_TOKEN:-}"
      SPLUNK_TRACES_ENDPOINT: "${SPLUNK_TRACES_ENDPOINT:-}"
    volumes:
      - ./deploy/observability/otel:/etc/otel:ro
    ports:
      - "${PARITYPAY_OTLP_GRPC_PORT:-4317}:4317"
      - "${PARITYPAY_OTLP_HTTP_PORT:-4318}:4318"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ---------- Jaeger ----------
  # 기준선입니다. 기본 compose 에서는 앱이 Jaeger 의 OTLP 포트로 직접 보내지만, APM 실험에서는
  # 컬렉터가 그 자리(4317/4318)를 가져갑니다. 그래서 여기서는 UI 포트만 남깁니다 —
  # 같은 호스트 포트를 두 컨테이너가 쓸 수 없고, "앱이 보내는 자리는 늘 컬렉터"여야 합니다.
  jaeger:
    profiles: ["apm-jaeger"]
    # 메모리 저장소는 상한이 없으면 전량 샘플링 부하에서 계속 자라고, 컨테이너가 OOM 으로 죽습니다
    # (실제로 Exited 137 을 두 번 봤습니다). 실험에 필요한 만큼만 들고 있게 합니다.
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      MEMORY_MAX_TRACES: "20000"
    mem_limit: 1g
    ports: !override
      - "${PARITYPAY_JAEGER_UI_PORT:-16686}:16686"

  # ---------- Grafana Tempo ----------
  tempo:
    image: grafana/tempo:2.7.0
    container_name: paritypay-tempo
    profiles: ["apm-tempo"]
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./deploy/observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "${PARITYPAY_TEMPO_PORT:-3200}:3200"

  # ---------- Apache SkyWalking ----------
  # OTLP 가 아니라 **자체 Java 에이전트**로 받습니다(OAP gRPC 11800). 비교의 다른 축입니다 —
  # 에이전트가 다르면 같은 요청에서 보이는 스팬의 모양도 다릅니다.
  #
  # **10.x 에는 메모리 저장소(H2)가 없습니다.** `SW_STORAGE=h2` 로 띄우면 "no provider found for
  # module storage" 로 죽습니다 — 이미지의 oap-libs 에 들어 있는 저장소 플러그인은 BanyanDB 뿐입니다.
  # 그래서 저장소 컨테이너가 필수이고, 이것이 "컨테이너 하나로 끝나지 않는" 첫 번째 이유입니다.
  # 버전을 "latest" 로 두면 안 됩니다. OAP 10.4 는 BanyanDB **API 0.10** 만 받습니다 —
  # 0.11.1 로 띄웠더니 "Incompatible BanyanDB server API version: 0.11. But accepted versions: 0.10"
  # 으로 OAP 가 죽었습니다. 저장소를 따로 두는 도구는 그 둘의 버전까지 맞춰야 합니다.
  skywalking-banyandb:
    image: apache/skywalking-banyandb:0.10.3
    container_name: paritypay-skywalking-banyandb
    profiles: ["apm-skywalking"]
    command: ["standalone"]
    volumes:
      - skywalking-banyandb-data:/tmp

  skywalking-oap:
    image: apache/skywalking-oap-server:10.4.0-java21
    container_name: paritypay-skywalking-oap
    profiles: ["apm-skywalking"]
    environment:
      SW_STORAGE: banyandb
      SW_STORAGE_BANYANDB_TARGETS: skywalking-banyandb:17912
      SW_HEALTH_CHECKER: default
      JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${PARITYPAY_SKYWALKING_GRPC_PORT:-11800}:11800"
      - "${PARITYPAY_SKYWALKING_REST_PORT:-12800}:12800"
    depends_on:
      - skywalking-banyandb

  skywalking-ui:
    image: apache/skywalking-ui:10.4.0-java21
    container_name: paritypay-skywalking-ui
    profiles: ["apm-skywalking"]
    environment:
      SW_OAP_ADDRESS: http://skywalking-oap:12800
    ports:
      - "${PARITYPAY_SKYWALKING_UI_PORT:-18080}:8080"
    depends_on:
      - skywalking-oap

  # ---------- Zipkin ----------
  # 2012년 트위터가 Dapper 논문을 Thrift 용으로 구현해 공개한 것이고, 지금 쓰는 추적 도구 대부분의
  # 조상입니다. **OTLP 를 받지 않습니다** — 자기 형식만 받으므로 컬렉터의 exporter 가 zipkin 입니다.
  # 저장소는 기본값이 메모리이며, Jaeger 와 같은 이유로 상한을 둡니다.
  zipkin:
    image: openzipkin/zipkin:3.6.1
    container_name: paritypay-zipkin
    profiles: ["apm-zipkin"]
    environment:
      STORAGE_TYPE: mem
      # 메모리 저장소가 들고 있을 스팬 수입니다. 두지 않으면 전량 샘플링 부하에서 계속 자랍니다.
      MEM_MAX_SPANS: "500000"
      JAVA_OPTS: "-Xms256m -Xmx512m"
    mem_limit: 1g
    ports:
      - "${PARITYPAY_ZIPKIN_PORT:-9411}:9411"

  # ---------- Pinpoint ----------
  # SkyWalking 과 같은 자체 에이전트 계열이고, 저장소가 **HBase** 입니다. 컨테이너 수가 가장 많은
  # 쪽이라 "설치 비용"의 반대쪽 끝을 보여 줍니다. 구성은 공식 pinpoint-docker 의 최소 집합입니다
  # (web·collector·hbase·mysql·redis). flink·batch·quickstart 는 뺐습니다 — 각각 통계 집계·알람·
  # 예제 앱이고 트레이스 수집에는 필요하지 않습니다.
  #
  # **ZooKeeper 는 이름이 `zoo1` 이어야 합니다.** pinpoint-hbase 이미지의 hbase-site.xml 에
  # `<value>zoo1,zoo2,zoo3</value>` 가 **박혀 있습니다**(이미지 안에서 확인). 그래서 컨테이너를
  # 다른 이름으로 띄우면 HBase 가 "zoo1: Name or service not known" 으로 테이블조차 만들지 못하고,
  # collector·web 은 그 뒤에 "NoNode for /hbase/hbaseid" 로 죽습니다. 공식 compose 가 zoo1~zoo3 을
  # 띄우는 이유이며, 여기서는 한 컨테이너에 세 별칭을 달아 ZooKeeper 하나로 끝냅니다.
  # collector 의 `hbase.client.host=${pinpoint.zookeeper.address}` 도 같은 주소를 씁니다 —
  # HBase 접속과 클러스터 조정이 **한 변수를 공유합니다**.
  pinpoint-hbase:
    image: pinpointdocker/pinpoint-hbase:3.1.1
    container_name: paritypay-pinpoint-hbase
    profiles: ["apm-pinpoint"]
    depends_on:
      - pinpoint-zookeeper
    volumes:
      - pinpoint-hbase-data:/home/pinpoint/hbase
      # 세션 시간만 늘린 설정입니다. 파일 안에 이유를 적어 뒀습니다.
      - ./deploy/observability/pinpoint/hbase-site.xml:/opt/hbase/hbase-2.2.6/conf/hbase-site.xml:ro
      # 미리 쪼개는 리전 수만 줄인 스키마입니다. 원본은 1,900개가 넘고, 한 노드 에뮬레이션에서는
      # 그걸 만들다 멈춥니다. 자세한 이유는 파일 안에.
      - ./deploy/observability/pinpoint/hbase-create.hbase:/opt/pinpoint/hbase-create.hbase:ro
    # 이미지의 초기화 스크립트가 `sed -i` 로 hbase-create.hbase 를 고치므로 그 자리에 직접
    # 마운트할 수 없습니다(바인드 마운트된 파일은 rename 이 막힙니다). 그래서 다른 자리에 두고
    # 복사한 뒤 원래 순서대로 띄웁니다.
    entrypoint:
      - /bin/sh
      - -c
      - cp /opt/pinpoint/hbase-create.hbase /opt/hbase/hbase-create.hbase &&
        /usr/local/bin/initialize-hbase.sh && tail -f /dev/null

  pinpoint-zookeeper:
    image: zookeeper:3.4.13
    container_name: paritypay-pinpoint-zookeeper
    profiles: ["apm-pinpoint"]
    environment:
      ZOO_MY_ID: "1"
      ZOO_SERVERS: server.1=0.0.0.0:2888:3888
      # **ZooKeeper 서버가 세션 시간의 상한을 쥐고 있습니다.** 클라이언트(HBase)가 10분을 달라고 해도
      # 서버의 maxSessionTimeout 을 넘으면 조용히 깎입니다. 그리고 이 이미지에는
      # ZOO_MAX_SESSION_TIMEOUT 같은 변수가 **없습니다**(지원 변수는 ZOO_TICK_TIME·ZOO_INIT_LIMIT 등).
      # maxSessionTimeout 의 기본값이 20 × tickTime 이므로 tick 을 올려서 상한을 올립니다.
      # 15초 × 20 = 300초. 에뮬레이션에서 리전을 여는 동안 세션이 끊기지 않을 만큼입니다.
      ZOO_TICK_TIME: "15000"
    networks:
      default:
        # 세 별칭이 모두 이 컨테이너를 가리킵니다 (위 주석 참고).
        aliases: [zoo1, zoo2, zoo3]

  pinpoint-mysql:
    image: mysql:8.0
    container_name: paritypay-pinpoint-mysql
    profiles: ["apm-pinpoint"]
    # 비밀값에 기본값을 두지 않습니다(ADR-011). apm.sh 가 설치할 때 한 번 만들어
    # .apm/pinpoint-mysql-password 에 적고, 없으면 compose 가 뜨지 않습니다.
    environment:
      MYSQL_ROOT_PASSWORD: ${PARITYPAY_PINPOINT_MYSQL_PASSWORD:?apm.sh up pinpoint 으로 띄우십시오}
      MYSQL_USER: admin
      MYSQL_PASSWORD: ${PARITYPAY_PINPOINT_MYSQL_PASSWORD:?apm.sh up pinpoint 으로 띄우십시오}
      MYSQL_DATABASE: pinpoint
    volumes:
      - pinpoint-mysql-data:/var/lib/mysql

  pinpoint-redis:
    image: redis:7.4-alpine
    container_name: paritypay-pinpoint-redis
    profiles: ["apm-pinpoint"]

  pinpoint-collector:
    image: pinpointdocker/pinpoint-collector:3.1.1
    container_name: paritypay-pinpoint-collector
    profiles: ["apm-pinpoint"]
    # HBase 는 처음 뜰 때 테이블을 만드는 데 2분 넘게 걸리고, 그동안 collector 와 web 은
    # "NoNode for /hbase/hbaseid" 로 **죽습니다**. depends_on 은 "컨테이너가 떴다"까지만 보장하므로
    # 소용이 없습니다. 공식 pinpoint-docker 도 같은 이유로 restart 에 맡깁니다.
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: release
      PINPOINT_ZOOKEEPER_ADDRESS: zoo1
      CLUSTER_ENABLE: "true"
      FLINK_CLUSTER_ENABLE: "false"
      SPRING_DATA_REDIS_HOST: pinpoint-redis
      SPRING_DATA_REDIS_PORT: "6379"
      LOGGING_LEVEL_ROOT: WARN
    ports:
      # 에이전트가 호스트에서 돌므로 gRPC 세 자리를 내보냅니다 (agent·stat·span).
      - "${PARITYPAY_PINPOINT_AGENT_PORT:-9991}:9991"
      - "${PARITYPAY_PINPOINT_STAT_PORT:-9992}:9992"
      - "${PARITYPAY_PINPOINT_SPAN_PORT:-9993}:9993"
    depends_on:
      - pinpoint-hbase
      - pinpoint-zookeeper
      - pinpoint-redis

  pinpoint-web:
    image: pinpointdocker/pinpoint-web:3.1.1
    container_name: paritypay-pinpoint-web
    profiles: ["apm-pinpoint"]
    # HBase 는 처음 뜰 때 테이블을 만드는 데 2분 넘게 걸리고, 그동안 collector 와 web 은
    # "NoNode for /hbase/hbaseid" 로 **죽습니다**. depends_on 은 "컨테이너가 떴다"까지만 보장하므로
    # 소용이 없습니다. 공식 pinpoint-docker 도 같은 이유로 restart 에 맡깁니다.
    restart: unless-stopped
    environment:
      WEB_SERVER_PORT: "8080"
      SPRING_PROFILES_ACTIVE: release
      PINPOINT_ZOOKEEPER_ADDRESS: zoo1
      CLUSTER_ENABLE: "true"
      CONFIG_SENDUSAGE: "false"
      CONFIG_SHOW_APPLICATIONSTAT: "true"
      LOGGING_LEVEL_ROOT: WARN
      JDBC_DRIVERCLASSNAME: com.mysql.jdbc.Driver
      SPRING_DATASOURCE_HIKARI_JDBCURL: jdbc:mysql://pinpoint-mysql:3306/pinpoint?characterEncoding=UTF-8
      SPRING_DATASOURCE_HIKARI_USERNAME: admin
      SPRING_DATASOURCE_HIKARI_PASSWORD: ${PARITYPAY_PINPOINT_MYSQL_PASSWORD:?apm.sh up pinpoint 으로 띄우십시오}
      SPRING_METADATASOURCE_HIKARI_JDBCURL: jdbc:mysql://pinpoint-mysql:3306/pinpoint?characterEncoding=UTF-8
      SPRING_METADATASOURCE_HIKARI_USERNAME: admin
      SPRING_METADATASOURCE_HIKARI_PASSWORD: ${PARITYPAY_PINPOINT_MYSQL_PASSWORD:?apm.sh up pinpoint 으로 띄우십시오}
      SPRING_DATA_REDIS_HOST: pinpoint-redis
      SPRING_DATA_REDIS_PORT: "6379"
    ports:
      - "${PARITYPAY_PINPOINT_WEB_PORT:-8081}:8080"
    depends_on:
      - pinpoint-hbase
      - pinpoint-mysql
      - pinpoint-zookeeper
      - pinpoint-redis

  # ---------- OpenObserve ----------
  # 이 랩에서 **컨테이너 하나로 끝나는 유일한 백엔드**입니다. 저장소가 내장(로컬 디스크 또는 S3)이라
  # ClickHouse·HBase·BanyanDB 를 따로 띄우지 않습니다 — 설치 비용 축의 한쪽 끝입니다.
  #
  # 첫 관리자 계정을 **환경변수로 받습니다.** SigNoz 는 사람이 화면에서 조직을 만들기 전까지
  # OTLP 포트를 아예 열지 않았는데(DOC-22 §3), 여기는 뜨는 즉시 받습니다. 그래서 측정 자동화에
  # 사람 손이 들어가지 않습니다.
  openobserve:
    image: openobserve/openobserve:v1.0.4
    container_name: paritypay-openobserve
    profiles: ["apm-openobserve"]
    environment:
      # 이메일은 비밀값이 아니라 식별자입니다. 비밀번호는 **기본값을 두지 않습니다**(ADR-011) —
      # scripts/apm.sh 가 만들어 .apm/openobserve-password 에 두고 여기로 넘깁니다.
      ZO_ROOT_USER_EMAIL: ${PARITYPAY_OPENOBSERVE_EMAIL:-paritypay@local.test}
      ZO_ROOT_USER_PASSWORD: ${PARITYPAY_OPENOBSERVE_PASSWORD:?apm.sh up openobserve 으로 띄우십시오}
      ZO_DATA_DIR: /data
      # 전량 샘플링 부하에서 디스크가 계속 자랍니다. 실험에 필요한 만큼만 들고 있게 합니다.
      ZO_COMPACT_DATA_RETENTION_DAYS: "3"
    volumes:
      - openobserve-data:/data
    ports:
      - "${PARITYPAY_OPENOBSERVE_PORT:-5080}:5080"
    mem_limit: 1g

  # ---------- Uptrace ----------
  # OTLP 네이티브이지만 저장소가 **셋**입니다 — ClickHouse(스팬)·PostgreSQL(사용자·프로젝트)·
  # Redis(캐시). SigNoz 와 같은 자리이고, OpenObserve 와 정반대입니다.
  #
  # 받는 쪽이 **토큰을 요구합니다.** 다만 토큰과 첫 사용자를 설정 파일(seed_data)에서 정할 수 있어
  # 사람이 화면에서 만들 필요는 없습니다 — SigNoz 와 갈라지는 지점입니다.
  uptrace-clickhouse:
    image: clickhouse/clickhouse-server:26.3
    container_name: paritypay-uptrace-clickhouse
    profiles: ["apm-uptrace"]
    environment:
      CLICKHOUSE_USER: uptrace
      CLICKHOUSE_DB: uptrace
      CLICKHOUSE_PASSWORD: ${PARITYPAY_UPTRACE_CH_PASSWORD:?apm.sh up uptrace 으로 띄우십시오}
    # 벤더 예시가 healthcheck 를 두는 이유가 있습니다 — uptrace 는 ClickHouse 가 준비되기 전에
    # 붙으면 스키마 마이그레이션에서 죽습니다. depends_on 만으로는 "떴다"까지만 보장합니다.
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8123/ping"]
      interval: 2s
      timeout: 2s
      retries: 60
    volumes:
      - uptrace-clickhouse-data:/var/lib/clickhouse
    mem_limit: 2g

  uptrace-postgres:
    image: postgres:17-alpine
    container_name: paritypay-uptrace-postgres
    profiles: ["apm-uptrace"]
    environment:
      POSTGRES_USER: uptrace
      POSTGRES_DB: uptrace
      POSTGRES_PASSWORD: ${PARITYPAY_UPTRACE_PG_PASSWORD:?apm.sh up uptrace 으로 띄우십시오}
      PGDATA: /var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uptrace -d uptrace"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - uptrace-postgres-data:/var/lib/postgresql/data/pgdata
    mem_limit: 512m

  uptrace-redis:
    image: redis:7.4-alpine
    container_name: paritypay-uptrace-redis
    profiles: ["apm-uptrace"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
    mem_limit: 256m

  uptrace:
    image: uptrace/uptrace:2.0.3
    container_name: paritypay-uptrace
    profiles: ["apm-uptrace"]
    # 설정 파일 안에서 ${VAR} 를 읽습니다. 비밀값은 전부 환경변수로만 들어오고 파일에는 없습니다.
    volumes:
      - ./deploy/observability/uptrace/uptrace.yml:/etc/uptrace/config.yml:ro
    environment:
      PARITYPAY_UPTRACE_SECRET: ${PARITYPAY_UPTRACE_SECRET:?apm.sh up uptrace 으로 띄우십시오}
      PARITYPAY_UPTRACE_ADMIN_EMAIL: ${PARITYPAY_UPTRACE_ADMIN_EMAIL:-paritypay@local.test}
      PARITYPAY_UPTRACE_ADMIN_PASSWORD: ${PARITYPAY_UPTRACE_ADMIN_PASSWORD:?apm.sh up uptrace 으로 띄우십시오}
      PARITYPAY_UPTRACE_PROJECT_TOKEN: ${PARITYPAY_UPTRACE_PROJECT_TOKEN:?apm.sh up uptrace 으로 띄우십시오}
      PARITYPAY_UPTRACE_CH_PASSWORD: ${PARITYPAY_UPTRACE_CH_PASSWORD:?apm.sh up uptrace 으로 띄우십시오}
      PARITYPAY_UPTRACE_PG_PASSWORD: ${PARITYPAY_UPTRACE_PG_PASSWORD:?apm.sh up uptrace 으로 띄우십시오}
      # 화면 링크를 만드는 데 쓰는 주소입니다. 호스트 포트가 밀리면 이 값도 따라가야 합니다.
      PARITYPAY_UPTRACE_PORT: ${PARITYPAY_UPTRACE_PORT:-14318}
    ports:
      # 컨테이너 안에서 UI·OTLP/HTTP 는 80, OTLP/gRPC 는 4317 입니다.
      - "${PARITYPAY_UPTRACE_PORT:-14318}:80"
    depends_on:
      uptrace-clickhouse:
        condition: service_healthy
      uptrace-postgres:
        condition: service_healthy
      uptrace-redis:
        condition: service_healthy
    mem_limit: 1g

  # ---------- Elastic (Elasticsearch + Kibana + APM Server) ----------
  # "로그 도구가 트레이스를 어떻게 보여주는가"를 보는 축입니다. 컨테이너가 셋인데 그중 하나는
  # **화면 전용**(Kibana)이고 하나는 **수신 전용**(APM Server)입니다 — Jaeger 가 한 컨테이너에
  # 넣은 일을 셋으로 나눠 놓은 구조입니다.
  #
  # 수신을 APM Server 로 받습니다. contrib 0.119.0 에 elasticsearch exporter 가 있고 트레이스도
  # 보내지만(stability: traces Beta — 직접 확인), 기본 색인이 `traces-generic-default` 입니다.
  # Kibana 의 APM 화면이 읽는 자리는 `traces-apm*` 이라 **색인에는 들어가고 화면에는 안 나옵니다.**
  # APM Server 는 OTLP 를 받아 APM 데이터스트림으로 적으므로 화면까지 이어집니다.
  elastic-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.1
    container_name: paritypay-elastic-elasticsearch
    profiles: ["apm-elastic"]
    environment:
      discovery.type: single-node
      # 로컬 랩이라 보안을 끕니다. 켜면 ES·Kibana·APM Server 사이에 인증서와 비밀번호를 세 번
      # 맞춰야 하고, 그것은 이 실험이 재는 것(트레이스가 보이는가)과 무관합니다.
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      # 기본 힙은 호스트 메모리의 절반을 잡습니다. 셋이 같이 떠야 하므로 고정합니다 — 이 랩에서
      # Elastic 이 가장 큰 쪽이고, 호스트에 다른 프로젝트가 떠 있으면 기본값으로는 들어가지
      # 않습니다(실제로 Docker 7.7GiB 중 4.5GiB 가 이미 차 있어 못 띄웠습니다).
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elastic-data:/usr/share/elasticsearch/data
    ports:
      - "${PARITYPAY_ELASTICSEARCH_PORT:-9200}:9200"
    mem_limit: 1200m

  elastic-apm-server:
    image: docker.elastic.co/apm/apm-server:8.17.1
    container_name: paritypay-elastic-apm-server
    profiles: ["apm-elastic"]
    volumes:
      - ./deploy/observability/elastic/apm-server.yml:/usr/share/apm-server/apm-server.yml:ro
    environment:
      # 토큰이 없으면 APM Server 가 **아무 데이터도 받지 않습니다.** 기본값을 두지 않습니다(ADR-011).
      PARITYPAY_ELASTIC_APM_TOKEN: ${PARITYPAY_ELASTIC_APM_TOKEN:?apm.sh up elastic 으로 띄우십시오}
    depends_on:
      - elastic-elasticsearch
    # ES 가 색인 템플릿을 받을 준비가 되기 전에 뜨면 APM Server 가 종료합니다. HBase 와 같은 이유로
    # restart 에 맡깁니다 — depends_on 은 "컨테이너가 떴다"까지만 보장합니다.
    restart: unless-stopped
    mem_limit: 300m

  elastic-kibana:
    image: docker.elastic.co/kibana/kibana:8.17.1
    container_name: paritypay-elastic-kibana
    profiles: ["apm-elastic"]
    environment:
      ELASTICSEARCH_HOSTS: http://elastic-elasticsearch:9200
      # 없으면 Kibana 가 매 기동마다 임시 키를 만들고, 저장된 객체를 다음 기동에서 읽지 못합니다.
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: ${PARITYPAY_KIBANA_ENCRYPTION_KEY:?apm.sh up elastic 으로 띄우십시오}
      XPACK_REPORTING_ENCRYPTIONKEY: ${PARITYPAY_KIBANA_ENCRYPTION_KEY:?apm.sh up elastic 으로 띄우십시오}
      XPACK_SECURITY_ENCRYPTIONKEY: ${PARITYPAY_KIBANA_ENCRYPTION_KEY:?apm.sh up elastic 으로 띄우십시오}
      # Kibana 의 Node 힙도 고정합니다. 기본값은 1.4GB 이고, 그대로 두면 위 ES 와 합쳐
      # 호스트에 들어가지 않습니다.
      NODE_OPTIONS: "--max-old-space-size=700"
    ports:
      - "${PARITYPAY_KIBANA_PORT:-5601}:5601"
    depends_on:
      - elastic-elasticsearch
    mem_limit: 1g

volumes:
  tempo-data:
  skywalking-banyandb-data:
  pinpoint-hbase-data:
  pinpoint-mysql-data:
  openobserve-data:
  uptrace-clickhouse-data:
  uptrace-postgres-data:
  elastic-data:
