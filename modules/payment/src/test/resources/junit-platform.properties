# 속성 기반 테스트 설정. 근거: CLAUDE.md §6, docs/10-test-strategy.md §5
#
# onlyfailures=false: 성공한 실행에도 시도 횟수와 seed를 출력합니다. seed가 보이지 않으면
# 실패를 재현할 수 없습니다.
jqwik.reporting.onlyfailures=false
# 실패 반례를 저장해 두고 다음 실행에서 먼저 돌립니다. 고친 줄 알았는데 아닌 경우를 즉시 잡습니다.
jqwik.database=.jqwik-database
jqwik.failures.after.default=SAMPLE_FIRST
jqwik.tries.default=1000
